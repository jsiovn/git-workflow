name: Commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Check out the pull request's own tip, not GitHub's synthetic merge
      # commit, with full history so every commit of the PR is present.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint every commit of the pull request
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: npx commitlint --from "HEAD~$COMMITS" --to HEAD --verbose
